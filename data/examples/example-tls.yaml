# yaml-language-server: $schema=../schema/library.schema.json
# FICTIONAL example entry. Exercises every field. Not a real library.
id: example-tls
name: ExampleTLS
ecosystem: c-cpp
description: A fictional TLS and crypto toolkit used to demo the schema.
homepage: https://example.com/exampletls
repo: https://github.com/example/exampletls
package_names:
  cargo: [exampletls-sys]
applicable_algorithms: [ml-kem, ml-dsa, slh-dsa, hybrid-tls]
overall_status: ready
algorithms:
  ml-kem:
    support: 'yes'
    since_version: '4.0.0'
    default_enabled: true
    experimental: false
    sources:
      - url: https://example.com/exampletls/releases/4.0.0
        title: ExampleTLS 4.0.0 release notes
        kind: release-notes
        quote: Added ML-KEM-512, ML-KEM-768 and ML-KEM-1024 (FIPS 203).
        retrieved: '2026-10-01'
  hybrid-tls:
    support: 'yes'
    since_version: '4.0.0'
    default_enabled: true
    notes: X25519MLKEM768 is offered first in the default TLS 1.3 groups list.
    sources:
      - url: https://example.com/exampletls/releases/4.0.0
        title: ExampleTLS 4.0.0 release notes
        kind: release-notes
        quote: X25519MLKEM768 is now the default key exchange group for TLS 1.3.
        retrieved: '2026-10-01'
  ml-dsa:
    support: partial
    since_version: '4.1.0'
    default_enabled: false
    experimental: true
    notes: Available only when built with --enable-experimental-pq-sigs.
    sources:
      - url: https://example.com/exampletls/docs/build-options
        title: ExampleTLS build options
        kind: docs
        quote: --enable-experimental-pq-sigs enables ML-DSA (experimental).
        retrieved: '2026-10-01'
  slh-dsa:
    support: unknown
    sources: []
roadmap:
  target_version: '4.2.0'
  target_date: 2027-03
  confidence: tentative
  summary: Stable ML-DSA and SLH-DSA signatures planned for 4.2.
  sources:
    - url: https://github.com/example/exampletls/issues/1234
      title: 'Roadmap: PQC signatures'
      kind: issue
      quote: We plan to ship stable ML-DSA and SLH-DSA in 4.2, tentatively March 2027.
      retrieved: '2026-10-01'
fips:
  status: in-process
  algorithms: [ml-kem]
  sources:
    - url: https://example.com/exampletls/fips
      title: ExampleTLS FIPS status
      kind: docs
      quote: The 4.0 module including ML-KEM has been submitted to CMVP.
      retrieved: '2026-10-01'
upgrade_notes: Upgrade to 4.0.0 or later; hybrid key exchange is on by default.
last_verified: '2026-10-01'
pipeline:
  watch_urls:
    - https://example.com/exampletls/docs/build-options
  changelog_path: CHANGES.md
