      - url: https://gitlab.com/libssh/libssh-mirror/-/raw/master/CHANGELOG
        title: libssh CHANGELOG, version 0.12.0
        kind: changelog
        quote: "* mlkem768x25519-sha256"
        retrieved: 2026-11-18
upgrade_notes: "ML-KEM: libssh 0.12.0 or later. On by default: ML-KEM."
