# yaml-language-server: $schema=../schema/library.schema.json
id: libcrux
name: libcrux
ecosystem: rust
description: Formally verified cryptography library from Cryspen.
repo: https://github.com/cryspen/libcrux
package_names:
  cargo:
    - libcrux-ml-kem
    - libcrux-ml-dsa
applicable_algorithms:
  - ml-kem
  - ml-dsa
overall_status: available
algorithms:
  ml-kem:
    support: yes
    sources:
      - url: https://github.com/cryspen/libcrux/blob/HEAD/CHANGELOG.md
        title: cryspen/libcrux CHANGELOG.md
        kind: changelog
        quote: "(libcrux-kem) [#1595](https://github.com/celabshq/libcrux/pull/1595): Reject invalid/short seed lengths in `PublicKey::encapsulate_derand` without panicking; Return `Ss::MlKem512` variant instead of `Ss::MlKem768` variant when decapsulating `Ct::MlKem512` ciphertext"
        retrieved: 2026-11-13
  ml-dsa:
    support: yes
    sources:
      - url: https://github.com/cryspen/libcrux/blob/HEAD/CHANGELOG.md
        title: cryspen/libcrux CHANGELOG.md
        kind: changelog
        quote: "(libcrux-ml-dsa) [#1398](https://github.com/celabshq/libcrux/pull/1398): Fix incorrect AVX2 use_hint implementation"
        retrieved: 2026-11-13
upgrade_notes: "ML-KEM and ML-DSA: supported in current releases; the sources don't state the first version."
last_verified: 2026-11-13T12:45:18Z
