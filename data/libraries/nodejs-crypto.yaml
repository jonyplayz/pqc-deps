# yaml-language-server: $schema=../schema/library.schema.json
id: nodejs-crypto
name: Node.js crypto and tls
ecosystem: javascript
description: Node.js's built-in crypto, tls and WebCrypto.
homepage: https://nodejs.org/api/crypto.html
repo: https://github.com/nodejs/node
implicit_for:
  - npm
delegates_to:
  - id: openssl
    condition: OpenSSL bundled in official builds
applicable_algorithms:
  - ml-kem
  - ml-dsa
  - slh-dsa
  - hybrid-tls
overall_status: unknown
algorithms: {}
last_verified: 2026-11-08
