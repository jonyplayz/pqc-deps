# yaml-language-server: $schema=../schema/library.schema.json
id: okhttp
name: OkHttp
ecosystem: jvm
description: HTTP client for Java and Android.
repo: https://github.com/lysine-dev/okhttp
package_names:
  maven:
    - com.squareup.okhttp3:okhttp
delegates_to:
  - id: openjdk
    condition: on the JVM
applicable_algorithms:
  - hybrid-tls
overall_status: n/a
algorithms: {}
notes: OkHttp uses the platform's TLS implementation (the JDK's on the JVM, Conscrypt or the system's on Android), so post-quantum key exchange depends on that.
