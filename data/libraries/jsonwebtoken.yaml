# yaml-language-server: $schema=../schema/library.schema.json
id: jsonwebtoken
name: jsonwebtoken
ecosystem: javascript
description: JSON Web Token implementation for Node.js.
repo: https://github.com/auth0/node-jsonwebtoken
package_names:
  npm:
    - jsonwebtoken
delegates_to:
  - id: nodejs-crypto
applicable_algorithms:
  - ml-dsa
  - slh-dsa
overall_status: no-plan
algorithms: {}
notes: No ML-DSA or other post-quantum algorithm support, and no issue or pull request about it in the project's tracker. Post-quantum JWS needs the library to add new alg values even though Node.js crypto can do the signing; for ML-DSA tokens in JavaScript today, see jose.
last_verified: 2026-11-11
