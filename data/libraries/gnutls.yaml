# yaml-language-server: $schema=../schema/library.schema.json
id: gnutls
name: GnuTLS
ecosystem: c-cpp
description: GNU TLS library.
homepage: https://www.gnutls.org
repo: https://gitlab.com/gnutls/gnutls
applicable_algorithms:
  - ml-kem
  - ml-dsa
  - slh-dsa
  - hybrid-tls
overall_status: partial
algorithms:
  ml-kem:
    support: yes
    since_version: 3.8.8
    sources:
      - url: https://gitlab.com/gnutls/gnutls/-/raw/master/NEWS
        title: https://gitlab.com/gnutls/gnutls/-/raw/master/NEWS
        kind: release-notes
        quote: "** libgnutls: Experimental support for X25519MLKEM768 and SecP256r1MLKEM768 key exchange in TLS 1.3"
        retrieved: 2026-11-11
      - url: https://gitlab.com/gnutls/gnutls/-/raw/master/NEWS
        title: https://gitlab.com/gnutls/gnutls/-/raw/master/NEWS
        kind: release-notes
        quote: "** libgnutls: Support for ML-KEM-1024 key encapsulation mechanism"
        retrieved: 2026-11-11
  ml-dsa:
    support: partial
    experimental: true
    sources:
      - url: https://gitlab.com/gnutls/gnutls/-/raw/master/NEWS
        title: https://gitlab.com/gnutls/gnutls/-/raw/master/NEWS
        kind: release-notes
        quote: "** libgnutls: Experimental support for ML-DSA signature algorithm"
        retrieved: 2026-11-11
      - url: https://gitlab.com/gnutls/gnutls/-/raw/master/NEWS
        title: https://gitlab.com/gnutls/gnutls/-/raw/master/NEWS
        kind: release-notes
        quote: "** libgnutls: ML-DSA signatures can now be used in TLS"
        retrieved: 2026-11-11
  hybrid-tls:
    support: partial
    since_version: 3.8.8
    experimental: true
    sources:
      - url: https://gitlab.com/gnutls/gnutls/-/raw/master/NEWS
        title: https://gitlab.com/gnutls/gnutls/-/raw/master/NEWS
        kind: release-notes
        quote: "** libgnutls: Experimental support for X25519MLKEM768 and SecP256r1MLKEM768 key exchange in TLS 1.3"
        retrieved: 2026-11-11
upgrade_notes: "ML-KEM: GnuTLS 3.8.8 or later. Partial or experimental: ML-DSA and hybrid TLS key exchange; check the notes before relying on it."
last_verified: 2026-11-11
pipeline:
  watch_urls:
    - https://gitlab.com/gnutls/gnutls/-/raw/master/NEWS
  locked: []
