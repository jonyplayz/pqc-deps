# yaml-language-server: $schema=../schema/library.schema.json
id: grpcio
name: gRPC (Python)
ecosystem: python
description: Python package of gRPC, built on gRPC core.
repo: https://github.com/grpc/grpc
package_names:
  pypi:
    - grpcio
delegates_to:
  - id: boringssl
applicable_algorithms:
  - hybrid-tls
overall_status: n/a
algorithms:
  hybrid-tls:
    support: yes
    default_enabled: true
    experimental: false
    sources:
      - url: https://github.com/grpc/grpc/releases/tag/v1.83.0
        title: Release v1.83.0
        kind: release-notes
        quote: "-  [Security] Default to Post-Quantum Cryptography in TLS key exchange. ([#42560](https://github.com/grpc/grpc/pull/42560))"
        retrieved: 2026-11-19
upgrade_notes: "hybrid TLS key exchange: supported in current releases; the sources don't state the first version. On by default: hybrid TLS key exchange."
notes: gRPC core ships with BoringSSL for TLS.
last_verified: 2026-11-26T13:56:17Z
