# yaml-language-server: $schema=../schema/library.schema.json
id: oqs-provider
name: oqs-provider
ecosystem: c-cpp
description: OpenSSL 3 provider that adds liboqs algorithms.
repo: https://github.com/open-quantum-safe/oqs-provider
delegates_to:
  - id: liboqs
applicable_algorithms:
  - hybrid-tls
  - ml-kem
  - ml-dsa
  - slh-dsa
overall_status: available
algorithms:
  ml-kem:
    support: yes
    sources:
      - url: https://github.com/open-quantum-safe/oqs-provider/releases/tag/0.8.0
        title: 0.8.0
        kind: release-notes
        quote: Updates IANA code points for ML-KEM and changes FrodoKEM code points.
        retrieved: 2026-11-17
  ml-dsa:
    support: yes
    since_version: 0.8.0
    sources:
      - url: https://github.com/open-quantum-safe/oqs-provider/releases/tag/0.8.0
        title: 0.8.0
        kind: release-notes
        quote: Adds support for ML-DSA (FIPS 204 final version).
        retrieved: 2026-11-17
  slh-dsa:
    support: yes
    since_version: 0.12.0
    sources:
      - url: https://github.com/open-quantum-safe/oqs-provider/releases/tag/0.12.0
        title: 0.12.0
        kind: release-notes
        quote: Added "pure" SLH-DSA algorithms ([#732](https://github.com/open-quantum-safe/oqs-provider/pull/732)). Supports OpenSSL versions < 3.5.
        retrieved: 2026-11-17
  hybrid-tls:
    support: yes
    sources:
      - url: https://github.com/open-quantum-safe/oqs-provider/releases/tag/0.12.0
        title: 0.12.0
        kind: release-notes
        quote: "**oqs-provider** is a standalone [OpenSSL 3+](https://github.com/openssl/openssl) [provider](https://www.openssl.org/docs/manmaster/man7/provider.html) enabling [liboqs](https://github.com/open-quantum-safe/liboqs)-based quantum-safe and [hybrid key exchange](https://datatracker.ietf.org/doc/draft-ietf-pquip-pqt-hybrid-terminology) for TLS 1.3"
        retrieved: 2026-11-17
  hqc:
    support: yes
    since_version: 0.12.0
    sources:
      - url: https://github.com/open-quantum-safe/oqs-provider/releases/tag/0.12.0
        title: 0.12.0
        kind: release-notes
        quote: Reinstated HQC with the `liboqs` 0.16.0 naming hqc128, hqc192 and hqc256 to hqc1, hqc3 and hqc5. ([#787](https://github.com/open-quantum-safe/oqs-provider/pull/787)).
        retrieved: 2026-11-17
upgrade_notes: "ML-DSA: oqs-provider 0.8.0 or later. SLH-DSA: oqs-provider 0.12.0 or later. hybrid TLS key exchange and ML-KEM: supported in current releases; the sources don't state the first version."
last_verified: 2026-11-17T13:34:53Z
