    - url: https://techcommunity.microsoft.com/blog/microsoft-security-blog/post-quantum-cryptography-apis-now-generally-available-on-microsoft-platforms/4469093
      title: Post-Quantum Cryptography APIs Now Generally Available on Microsoft Platforms
