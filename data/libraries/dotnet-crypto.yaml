# yaml-language-server: $schema=../schema/library.schema.json
id: dotnet-crypto
name: .NET cryptography
ecosystem: dotnet
description: System.Security.Cryptography and SslStream in .NET.
homepage: https://learn.microsoft.com/dotnet/standard/security/cryptography-model
repo: https://github.com/dotnet/runtime
implicit_for:
  - nuget
delegates_to:
  - id: openssl
    condition: on Linux
applicable_algorithms:
  - ml-kem
  - ml-dsa
  - slh-dsa
  - hybrid-tls
overall_status: available
algorithms:
  ml-kem:
    support: yes
    experimental: false
    sources:
      - url: https://github.com/dotnet/runtime/releases/tag/v10.0.12
        title: .NET 10.0.12
        kind: release-notes
        quote: "* [release/10.0] Fix IsSupported tests for ML-KEM by @github-actions[bot] in https://github.com/dotnet/runtime/pull/132512"
        retrieved: 2026-11-17
  ml-dsa:
    support: yes
    experimental: false
    sources:
      - url: https://github.com/dotnet/runtime/releases/tag/v10.0.10
        title: .NET 10.0.10
        kind: release-notes
        quote: "* [release/10.0] Fix blob type in CopyWithPrivateKey for ML-DSA by @github-actions[bot] in https://github.com/dotnet/runtime/pull/129865"
        retrieved: 2026-11-17
upgrade_notes: "ML-KEM and ML-DSA: supported in current releases; the sources don't state the first version."
last_verified: 2026-11-17T13:34:01Z
