# yaml-language-server: $schema=../schema/library.schema.json
id: netty-tcnative
name: Netty tcnative
ecosystem: jvm
description: Native TLS for Netty, statically linked with BoringSSL.
repo: https://github.com/netty/netty-tcnative
package_names:
  maven:
    - io.netty:netty-tcnative-boringssl-static
delegates_to:
  - id: boringssl
applicable_algorithms:
  - hybrid-tls
overall_status: n/a
algorithms: {}
notes: netty-tcnative is Netty's binding to a statically linked BoringSSL; the TLS key exchange, including X25519MLKEM768, comes from BoringSSL.
