# yaml-language-server: $schema=../schema/library.schema.json
id: microsoft-identitymodel
name: Microsoft IdentityModel (JWT)
ecosystem: dotnet
description: .NET libraries for JSON Web Tokens and identity protocols.
repo: https://github.com/AzureAD/azure-activedirectory-identitymodel-extensions-for-dotnet
package_names:
  nuget:
    - Microsoft.IdentityModel.JsonWebTokens
    - System.IdentityModel.Tokens.Jwt
delegates_to:
  - id: dotnet-crypto
applicable_algorithms:
  - ml-dsa
  - ml-kem
overall_status: available
algorithms:
  ml-dsa:
    support: yes
    since_version: 8.19.0
    experimental: false
    sources:
      - url: https://github.com/AzureAD/azure-activedirectory-identitymodel-extensions-for-dotnet/blob/dev/CHANGELOG.md
        title: IdentityModel CHANGELOG, 8.19.0
        kind: changelog
        quote: "- Add ML-DSA (FIPS 204) post-quantum signature support."
        retrieved: 2026-11-18
upgrade_notes: "ML-DSA: Microsoft IdentityModel (JWT) 8.19.0 or later."
last_verified: 2026-11-22T12:36:09Z
