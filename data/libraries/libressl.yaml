# yaml-language-server: $schema=../schema/library.schema.json
id: libressl
name: LibreSSL
ecosystem: c-cpp
description: OpenBSD fork of OpenSSL.
homepage: https://www.libressl.org
repo: https://github.com/libressl/portable
applicable_algorithms:
  - ml-kem
  - ml-dsa
  - slh-dsa
  - hybrid-tls
overall_status: available
algorithms:
  ml-kem:
    support: yes
    since_version: 4.3.0
    sources:
      - url: https://github.com/libressl/portable/releases/tag/v4.3.0
        title: v4.3.0
        kind: release-notes
        quote: Support for MLKEM768_X25519 keyshare in TLS.
        retrieved: 2026-11-11
  ml-dsa:
    support: partial
    experimental: true
    sources:
      - url: https://github.com/libressl/portable/blob/HEAD/ChangeLog
        title: libressl/portable ChangeLog
        kind: changelog
        quote: Added an experimental ML-DSA API based on BoringSSL's code.
        retrieved: 2026-11-11
  hybrid-tls:
    support: yes
    since_version: 4.4.0
    sources:
      - url: https://github.com/libressl/portable/releases/tag/v4.4.0
        title: v4.4.0
        kind: release-notes
        quote: Use X25519MLKEM768 as the preferred group for TLSv1.3 connections in libtls.
        retrieved: 2026-11-11
upgrade_notes: "ML-KEM: LibreSSL 4.3.0 or later. hybrid TLS key exchange: LibreSSL 4.4.0 or later. Partial or experimental: ML-DSA; check the notes before relying on it."
last_verified: 2026-11-11
