# yaml-language-server: $schema=../schema/library.schema.json
id: liboqs
name: liboqs
ecosystem: c-cpp
description: Open Quantum Safe C library of post-quantum algorithms.
homepage: https://openquantumsafe.org
repo: https://github.com/open-quantum-safe/liboqs
applicable_algorithms:
  - ml-kem
  - ml-dsa
  - slh-dsa
overall_status: partial
algorithms:
  ml-kem:
    support: yes
    since_version: 0.11.0
    experimental: true
    sources:
      - url: https://github.com/open-quantum-safe/liboqs/releases/tag/0.11.0
        title: liboqs version 0.11.0
        kind: release-notes
        quote: This release updates ML-KEM implementations to their [final FIPS 203](https://csrc.nist.gov/pubs/fips/203/final) versions.
        retrieved: 2026-11-11
      - url: https://github.com/open-quantum-safe/liboqs/blob/main/README.md
        title: liboqs README
        kind: docs
        quote: "**WE DO NOT CURRENTLY RECOMMEND RELYING ON THIS LIBRARY IN A PRODUCTION ENVIRONMENT OR TO PROTECT ANY SENSITIVE DATA.**"
        retrieved: 2026-11-11
  ml-dsa:
    support: yes
    since_version: 0.12.0
    experimental: true
    sources:
      - url: https://github.com/open-quantum-safe/liboqs/releases/tag/0.12.0
        title: liboqs version 0.12.0
        kind: release-notes
        quote: This release updates the ML-DSA implementation to the [final FIPS 204](https://csrc.nist.gov/pubs/fips/204/final) version.
        retrieved: 2026-11-11
      - url: https://github.com/open-quantum-safe/liboqs/blob/main/README.md
        title: liboqs README
        kind: docs
        quote: "**WE DO NOT CURRENTLY RECOMMEND RELYING ON THIS LIBRARY IN A PRODUCTION ENVIRONMENT OR TO PROTECT ANY SENSITIVE DATA.**"
        retrieved: 2026-11-11
  slh-dsa:
    support: yes
    since_version: 0.15.0
    experimental: true
    sources:
      - url: https://github.com/open-quantum-safe/liboqs/releases/tag/0.15.0
        title: liboqs version 0.15.0
        kind: release-notes
        quote: "- **Integrated SLH-DSA implementation from [pq-code-package/slhdsa-c](https://github.com/pq-code-package/slhdsa-c/)**"
        retrieved: 2026-11-11
      - url: https://github.com/open-quantum-safe/liboqs/blob/main/README.md
        title: liboqs README
        kind: docs
        quote: "**WE DO NOT CURRENTLY RECOMMEND RELYING ON THIS LIBRARY IN A PRODUCTION ENVIRONMENT OR TO PROTECT ANY SENSITIVE DATA.**"
        retrieved: 2026-11-11
upgrade_notes: "Final FIPS versions: ML-KEM from 0.11.0, ML-DSA from 0.12.0, SLH-DSA from 0.15.0. The project calls liboqs a research and prototyping library and does not recommend it for production."
last_verified: 2026-11-11
pipeline:
  watch_urls:
    - https://openquantumsafe.org/liboqs/
  locked:
    - path: overall_status
      reason: the README says not to rely on liboqs in production, so its support counts as experimental
    - path: algorithms.ml-kem.experimental
      reason: the README says not to rely on liboqs in production, so its support counts as experimental
    - path: algorithms.ml-dsa.experimental
      reason: the README says not to rely on liboqs in production, so its support counts as experimental
    - path: algorithms.slh-dsa.experimental
      reason: the README says not to rely on liboqs in production, so its support counts as experimental
    - path: algorithms.hybrid-tls
      reason: liboqs has no TLS; the quote is about other projects using liboqs for TLS
