# yaml-language-server: $schema=../schema/library.schema.json
id: liboqs
name: liboqs
ecosystem: c-cpp
description: Open Quantum Safe C library of post-quantum algorithms.
homepage: https://openquantumsafe.org
repo: https://github.com/open-quantum-safe/liboqs
applicable_algorithms:
  - ml-kem
  - ml-dsa
  - slh-dsa
overall_status: partial
algorithms:
  ml-kem:
    support: yes
    since_version: 0.13.0
    experimental: true
    sources:
      - url: https://github.com/open-quantum-safe/liboqs/releases/tag/0.13.0
        title: liboqs version 0.13.0
        kind: release-notes
        quote: "- ML-KEM: Changed the default ML-KEM implementation to [PQCP's mlkem-native](https://github.com/pq-code-package/mlkem-native)."
        retrieved: 2026-11-16
  ml-dsa:
    support: yes
    since_version: 0.13.0
    experimental: true
    sources:
      - url: https://github.com/open-quantum-safe/liboqs/releases/tag/0.13.0
        title: liboqs version 0.13.0
        kind: release-notes
        quote: "- ML-DSA: Improved testing for ML-DSA."
        retrieved: 2026-11-16
  slh-dsa:
    support: yes
    since_version: 0.15.0
    experimental: true
    sources:
      - url: https://github.com/open-quantum-safe/liboqs/releases/tag/0.15.0
        title: liboqs version 0.15.0
        kind: release-notes
        quote: "- **Integrated SLH-DSA implementation from [pq-code-package/slhdsa-c](https://github.com/pq-code-package/slhdsa-c/)**"
        retrieved: 2026-11-16
  hqc:
    support: yes
    since_version: 0.16.0
    experimental: true
    sources:
      - url: https://github.com/open-quantum-safe/liboqs/releases/tag/0.16.0
        title: liboqs version 0.16.0
        kind: release-notes
        quote: "`KEM_hqc_<1|3|5>` is now enabled by default."
        retrieved: 2026-11-16
upgrade_notes: "ML-KEM and ML-DSA: liboqs 0.13.0 or later. SLH-DSA: liboqs 0.15.0 or later."
last_verified: 2026-11-16T12:44:47Z
