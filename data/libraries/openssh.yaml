# yaml-language-server: $schema=../schema/library.schema.json
id: openssh
name: OpenSSH
ecosystem: c-cpp
description: SSH client and server.
homepage: https://www.openssh.com
repo: https://github.com/openssh/openssh-portable
applicable_algorithms:
  - ml-kem
  - ml-dsa
  - slh-dsa
overall_status: ready
algorithms:
  ml-kem:
    support: yes
    default_enabled: true
    experimental: false
    sources:
      - url: https://www.openssh.com/releasenotes.html
        title: "OpenSSH: Release Notes"
        kind: release-notes
        quote: "ssh(1): the hybrid post-quantum algorithm mlkem768x25519-sha256 is now used by default for key agreement."
        retrieved: 2026-11-15
      - url: https://www.openssh.com/releasenotes.html
        title: "OpenSSH: Release Notes"
        kind: release-notes
        quote: This algorithm "mlkem768x25519-sha256" is available by default.
        retrieved: 2026-11-15
  ml-dsa:
    support: yes
    experimental: false
    sources:
      - url: https://www.openssh.com/releasenotes.html
        title: "OpenSSH: Release Notes"
        kind: release-notes
        quote: "All: enable hybrid post-quantum ssh-mldsa44-ed25519 signature algorithm."
        retrieved: 2026-11-15
upgrade_notes: "ML-KEM and ML-DSA: supported in current releases; the sources don't state the first version. On by default: ML-KEM."
last_verified: 2026-11-22T12:36:09Z
pipeline:
  watch_urls:
    - https://www.openssh.com/releasenotes.html
  locked: []
