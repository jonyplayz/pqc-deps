# yaml-language-server: $schema=../schema/library.schema.json
id: openjdk
name: Java (OpenJDK) security providers
ecosystem: jvm
description: The JDK's built-in cryptography (JCA/JCE) and TLS (JSSE).
homepage: https://openjdk.org
repo: https://github.com/openjdk/jdk
implicit_for:
  - maven
applicable_algorithms:
  - ml-kem
  - ml-dsa
  - slh-dsa
  - hybrid-tls
overall_status: partial
algorithms:
  ml-kem:
    support: yes
    sources:
      - url: https://openjdk.org/jeps/496
        title: "JEP 496: Quantum-Resistant Module-Lattice-Based Key Encapsulation Mechanism"
        kind: docs
        quote: Provide ML-KEM implementations of the KeyPairGenerator, KEM, and KeyFactory APIs, with support for the parameter sets ML-KEM-512, ML-KEM-768, and ML-KEM-1024 standardized in FIPS 203.
        retrieved: 2026-11-09
  ml-dsa:
    support: yes
    sources:
      - url: https://openjdk.org/jeps/497
        title: "JEP 497: Quantum-Resistant Module-Lattice-Based Digital Signature Algorithm"
        kind: docs
        quote: Provide ML-DSA implementations of the KeyPairGenerator, Signature, and KeyFactory APIs, with support for the parameter sets ML-DSA-44, ML-DSA-65, and ML-DSA-87 standardized in FIPS 204.
        retrieved: 2026-11-09
upgrade_notes: "ML-KEM and ML-DSA: supported in current releases; the sources don't state the first version."
last_verified: 2026-11-09
pipeline:
  watch_urls:
    - https://openjdk.org/jeps/496
    - https://openjdk.org/jeps/497
