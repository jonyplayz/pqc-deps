# yaml-language-server: $schema=../schema/library.schema.json
id: bouncycastle-java
name: Bouncy Castle (Java)
ecosystem: jvm
description: Cryptography APIs and JCA provider for Java.
homepage: https://www.bouncycastle.org
repo: https://github.com/bcgit/bc-java
package_names:
  maven:
    - org.bouncycastle:bcprov-jdk18on
    - org.bouncycastle:bcprov-jdk15to18
    - org.bouncycastle:bcpkix-jdk18on
    - org.bouncycastle:bctls-jdk18on
    - org.bouncycastle:bcutil-jdk18on
applicable_algorithms:
  - ml-kem
  - ml-dsa
  - slh-dsa
  - hybrid-tls
overall_status: ready
algorithms:
  ml-kem:
    support: yes
    since_version: "1.79"
    experimental: false
    sources:
      - url: https://github.com/bcgit/bc-java/blob/main/docs/releasenotes.md
        title: Bouncy Castle release notes, 1.79
        kind: release-notes
        quote: "- The PQC algorithms, ML-KEM, ML-DSA (including pre-hash), and SLH-DSA (including pre-hash) have been added to the BC provider and the lightweight API."
        retrieved: 2026-11-11
  ml-dsa:
    support: yes
    since_version: "1.79"
    experimental: false
    sources:
      - url: https://github.com/bcgit/bc-java/blob/main/docs/releasenotes.md
        title: Bouncy Castle release notes, 1.79
        kind: release-notes
        quote: "- The PQC algorithms, ML-KEM, ML-DSA (including pre-hash), and SLH-DSA (including pre-hash) have been added to the BC provider and the lightweight API."
        retrieved: 2026-11-11
  slh-dsa:
    support: yes
    since_version: "1.79"
    experimental: false
    sources:
      - url: https://github.com/bcgit/bc-java/blob/main/docs/releasenotes.md
        title: Bouncy Castle release notes, 1.79
        kind: release-notes
        quote: "- The PQC algorithms, ML-KEM, ML-DSA (including pre-hash), and SLH-DSA (including pre-hash) have been added to the BC provider and the lightweight API."
        retrieved: 2026-11-11
  hybrid-tls:
    support: yes
    since_version: "1.81"
    default_enabled: true
    experimental: false
    sources:
      - url: https://github.com/bcgit/bc-java/blob/main/docs/releasenotes.md
        title: Bouncy Castle release notes, 1.81
        kind: release-notes
        quote: "- BCJSSE: Draft support for hybrid ECDHE-MLKEM (draft-ietf-tls-ecdhe-mlkem-00)."
        retrieved: 2026-11-11
      - url: https://github.com/bcgit/bc-java/blob/main/docs/releasenotes.md
        title: Bouncy Castle release notes, 1.86
        kind: release-notes
        quote: "NamedGroupInfo's default candidate list, which applies when jdk.tls.namedGroups is not set, gains SecP256r1MLKEM768 and SecP384r1MLKEM1024, appended so the classical groups keep their existing preference."
        retrieved: 2026-11-11
upgrade_notes: "Use 1.79 or later for ML-KEM, ML-DSA and SLH-DSA, and 1.81 or later (bctls) for hybrid ML-KEM key exchange in TLS 1.3. In 1.86 the hybrid groups are in the default named-group list."
last_verified: 2026-11-11
pipeline:
  watch_urls:
    - https://raw.githubusercontent.com/bcgit/bc-java/main/docs/releasenotes.md
  locked:
    - path: algorithms.hqc
      reason: the only evidence is a 1.86 hardening note, which shows neither support nor a first version
