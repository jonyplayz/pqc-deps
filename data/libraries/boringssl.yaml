# yaml-language-server: $schema=../schema/library.schema.json
id: boringssl
name: BoringSSL
ecosystem: c-cpp
description: Google's fork of OpenSSL, used in Chrome and Android.
homepage: https://boringssl.googlesource.com/boringssl
repo: https://github.com/google/boringssl
applicable_algorithms:
  - ml-kem
  - ml-dsa
  - slh-dsa
  - hybrid-tls
overall_status: ready
algorithms:
  ml-kem:
    support: yes
    experimental: false
    sources:
      - url: https://raw.githubusercontent.com/google/boringssl/main/ssl/ssl_key_share.cc
        title: https://raw.githubusercontent.com/google/boringssl/main/ssl/ssl_key_share.cc
        kind: docs
        quote: '{NID_ML_KEM_1024, SSL_GROUP_MLKEM1024, "MLKEM1024", ""},'
        retrieved: 2026-11-13
  ml-dsa:
    support: yes
    experimental: false
    sources:
      - url: https://github.com/google/boringssl/blob/main/include/openssl/mldsa.h
        title: include/openssl/mldsa.h
        kind: other
        quote: |-
          // This implements the Module-Lattice-Based Digital Signature Standard from
          // https://csrc.nist.gov/pubs/fips/204/final
        retrieved: 2026-11-11
  slh-dsa:
    support: yes
    experimental: false
    sources:
      - url: https://github.com/google/boringssl/blob/main/include/openssl/slhdsa.h
        title: include/openssl/slhdsa.h
        kind: other
        quote: // SLH-DSA-SHA2-128s public key.
        retrieved: 2026-11-11
  hybrid-tls:
    support: yes
    default_enabled: true
    experimental: false
    sources:
      - url: https://github.com/google/boringssl/blob/main/ssl/ssl_key_share.cc
        title: ssl/ssl_key_share.cc
        kind: other
        quote: |-
          static const uint16_t kDefaultSupportedGroupIds[] = {
                SSL_GROUP_X25519_MLKEM768,
        retrieved: 2026-11-11
upgrade_notes: "ML-KEM, ML-DSA, SLH-DSA and hybrid TLS key exchange: supported in current releases; the sources don't state the first version. On by default: hybrid TLS key exchange."
notes: BoringSSL is not intended for general use and makes no API or ABI stability guarantees, so it has no numbered releases to compare against.
last_verified: 2026-11-13T12:11:20Z
pipeline:
  watch_urls:
    - https://raw.githubusercontent.com/google/boringssl/main/ssl/ssl_key_share.cc
  locked: []
