# yaml-language-server: $schema=../schema/library.schema.json
id: sequoia-pgp
name: Sequoia PGP
ecosystem: rust
description: OpenPGP implementation in Rust.
homepage: https://sequoia-pgp.org
repo: https://gitlab.com/sequoia-pgp/sequoia
package_names:
  cargo:
    - sequoia-openpgp
applicable_algorithms:
  - ml-kem
  - ml-dsa
  - slh-dsa
overall_status: available
algorithms:
  ml-kem:
    support: yes
    since_version: 2.4.0
    experimental: false
    notes: Post-quantum OpenPGP per RFC 9980, with the OpenSSL or RustCrypto backends.
    sources:
      - url: https://gitlab.com/sequoia-pgp/sequoia/-/raw/main/openpgp/NEWS
        title: sequoia-openpgp NEWS, 2.4.0
        kind: changelog
        quote: This version adds support for post-quantum cryptography as defined in RFC 9980.
        retrieved: 2026-11-18
      - url: https://gitlab.com/sequoia-pgp/sequoia/-/raw/main/openpgp/NEWS
        title: sequoia-openpgp NEWS, 2.4.0
        kind: changelog
        quote: includes support for Post-Quantum algorithms like ML-DSA, SLH-DSA, and ML-KEM.
        retrieved: 2026-11-18
  ml-dsa:
    support: yes
    since_version: 2.4.0
    experimental: false
    notes: Post-quantum OpenPGP per RFC 9980, with the OpenSSL or RustCrypto backends.
