        kind: issue
        quote: '{"MLKEM768", hpke.MLKEM768()}'
        retrieved: 2026-11-13
  ml-dsa:
    support: yes
    sources:
      - url: https://pkg.go.dev/crypto/tls
        title: tls package - crypto/tls - Go Packages
        kind: docs
        quote: MLDSA44 SignatureScheme = 0x0904
        retrieved: 2026-11-09
      - url: https://github.com/golang/go/pull/82302
        title: "PR #82302: crypto/internal/fips140/mldsa: compute cs1 and cs2 lazily when signing"
        kind: pull-request
