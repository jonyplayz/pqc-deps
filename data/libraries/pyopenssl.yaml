# yaml-language-server: $schema=../schema/library.schema.json
id: pyopenssl
name: pyOpenSSL
ecosystem: python
description: Python wrapper around OpenSSL, built on the cryptography package.
repo: https://github.com/pyca/pyopenssl
package_names:
  pypi:
    - pyOpenSSL
delegates_to:
  - id: python-cryptography
applicable_algorithms:
  - hybrid-tls
  - ml-kem
  - ml-dsa
overall_status: n/a
algorithms: {}
notes: pyOpenSSL wraps OpenSSL through the cryptography package and has no post-quantum APIs of its own; TLS key exchange follows the OpenSSL it is linked with. For ML-KEM and ML-DSA in Python, use cryptography.
